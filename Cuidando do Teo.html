<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: boneco Teo à esquerda (palco), pergunta e respostas à direita; empilha no celular. */
:root{
  --bg:#E8F2F3; --card:#FFFFFF; --ink:#12303A; --mute:#4F6C75; --line:#C9DDE0;
  --accent:#157C86; --accent-ink:#FFFFFF; --pain:#E0482B; --good:#237A4B; --good-bg:#DDF3E6;
  --bad-bg:#FBE3DC; --sun:#F2B134; --m-head:#5B8DEF; --m-belly:#F29B3D; --m-throat:#B55FD6;
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E2127; --card:#162E36; --ink:#E4F1F3; --mute:#9DBBC3; --line:#2B4954;
  --accent:#52C2CB; --accent-ink:#06242A; --pain:#FF7A5C; --good:#6FD39A; --good-bg:#183B2A;
  --bad-bg:#43241E; --sun:#F5C65A; --m-head:#7FA8F5; --m-belly:#F5AE63; --m-throat:#CB86E4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E2127; --card:#162E36; --ink:#E4F1F3; --mute:#9DBBC3; --line:#2B4954;
  --accent:#52C2CB; --accent-ink:#06242A; --pain:#FF7A5C; --good:#6FD39A; --good-bg:#183B2A;
  --bad-bg:#43241E; --sun:#F5C65A; --m-head:#7FA8F5; --m-belly:#F5AE63; --m-throat:#CB86E4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.7rem,5vw,2.3rem);margin:0;line-height:1.1}
.sub{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tog{font:inherit;font-weight:700;font-size:.9rem;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rounds{display:flex;flex-wrap:wrap;gap:8px}
.rp{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.92rem}
.rp.now{border-color:var(--accent)}
.rp .st{letter-spacing:2px;color:var(--sun)}
.game{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.game{grid-template-columns:minmax(0,1fr)}}
.stage,.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;min-width:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
.bubble{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:800;text-align:center;width:100%;min-height:3.4em;display:flex;align-items:center;justify-content:center}
.doll{width:100%;max-width:240px;height:auto;max-height:46vh}
@media (max-width:760px){.doll{max-height:260px}}
.zone{fill:transparent;pointer-events:none}
.doll.pick .zone{pointer-events:all;cursor:pointer}
.doll.pick .zone:hover,.doll.pick .zone:focus-visible{fill:color-mix(in srgb,var(--accent) 25%,transparent);outline:none}
.ring{fill:none;stroke:var(--pain);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.45}}
.panel{display:flex;flex-direction:column;gap:14px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--mute);border:2px solid transparent}
.sc.done{background:var(--good-bg);color:var(--good)}
.sc.now{border-color:var(--accent);color:var(--ink);background:var(--card)}
.q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
h2{font-family:var(--font-display);font-weight:500;font-size:clamp(1.3rem,3.6vw,1.7rem);margin:0;line-height:1.2;text-wrap:balance}
.listen{flex:none;font:inherit;font-weight:800;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer;min-height:44px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.opt{font:inherit;font-weight:800;text-align:center;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:14px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px;justify-content:center;transition:transform .12s}
.opt:hover{transform:translateY(-2px);border-color:var(--accent)}
.opt.miss{background:var(--bad-bg);border-color:var(--pain);opacity:.75;pointer-events:none}
.opt.hint{border-color:var(--good);background:var(--good-bg);animation:pulse 1.2s ease-in-out infinite}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.ico{display:grid;place-items:center;color:var(--accent)}
button:focus-visible,.zone:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.fb{min-height:2.6em;font-weight:800;border-radius:14px;padding:8px 12px}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.try{background:var(--bad-bg);color:var(--ink)}
.big{font:inherit;font-family:var(--font-display);font-weight:500;font-size:1.2rem;border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:14px 22px;cursor:pointer;min-height:56px;align-self:flex-start}
.ghost{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 16px;cursor:pointer;min-height:48px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.tile{font:inherit;font-weight:800;font-size:.9rem;letter-spacing:.06em;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px;justify-content:center}
.tile.on{border-color:var(--accent);background:var(--bg)}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:58px;border:3px dashed var(--line);border-radius:16px;padding:8px 12px;font-weight:800}
.chip{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:6px 12px;letter-spacing:.06em}
.muted{color:var(--mute);font-size:.92rem;margin:0}
.exp{background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:700}
.sum{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:var(--bg);font-weight:800}
.sum .st{color:var(--sun);letter-spacing:2px}
.note{font-size:.85rem;color:var(--mute);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Cuidando do Teo</h1>
      <p class="sub">Jogo de conversa: o que o Teo faz quando algo dói?</p>
    </div>
    <div class="tools">
      <button class="tog" id="tVoice" aria-pressed="true">Voz ligada</button>
      <button class="tog" id="tTher" aria-pressed="false">Resposta falada (adulto)</button>
    </div>
  </header>
  <div class="rounds" id="rounds"></div>
  <main class="game">
    <section class="stage" aria-label="Teo">
      <div class="bubble" id="bubble"></div>
      <div id="doll"></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <p class="note">Jogo educativo. Na vida real, remédio só com um adulto e quando o médico mandar.</p>
</div>

<script>
(function(){
var PARTS={
  cabeca:{label:'Cabeça',nome:'dor de cabeça',say:'Ai, minha cabeça está doendo!',cap:'CABEÇA'},
  barriga:{label:'Barriga',nome:'dor de barriga',say:'Ai, minha barriga está doendo!',cap:'BARRIGA'},
  garganta:{label:'Garganta',nome:'dor de garganta',say:'Ai, minha garganta está doendo!',cap:'GARGANTA'}
};
var ORDER=['cabeca','barriga','garganta'];
var MEDS={
  cabeca:{label:'Comprimido para dor de cabeça',icon:'pill'},
  barriga:{label:'Gotas para dor de barriga',icon:'drops'},
  garganta:{label:'Xarope para dor de garganta',icon:'syrup'}
};
var STEPNAMES=['Onde dói','Avisar (CAA)','Pedir ajuda','Médico','Remédio'];
var I={
  grid:'<rect x="6" y="6" width="15" height="15" rx="4"/><rect x="27" y="6" width="15" height="15" rx="4"/><rect x="6" y="27" width="15" height="15" rx="4"/><rect x="27" y="27" width="15" height="15" rx="4"/>',
  quiet:'<path d="M8 10h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-8 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/><path d="M16 22h.01M24 22h.01M32 22h.01"/>',
  house:'<path d="M6 24 24 8l18 16"/><path d="M12 20v20h24V20"/><path d="M20 40V28h8v12"/>',
  adult:'<circle cx="16" cy="12" r="6"/><path d="M6 42V30a10 10 0 0 1 20 0v12"/><circle cx="35" cy="26" r="4.5"/><path d="M28 42v-6a7 7 0 0 1 14 0v6"/>',
  alone:'<circle cx="24" cy="14" r="7"/><path d="M10 42V32a14 14 0 0 1 28 0v10"/>',
  ball:'<circle cx="24" cy="24" r="17"/><path d="M24 7v34M9 15q15 9 30 0M9 33q15-9 30 0"/>',
  cross:'<circle cx="24" cy="24" r="18"/><path d="M24 14v20M14 24h20"/>',
  tree:'<circle cx="24" cy="18" r="12"/><path d="M24 30v12M18 42h12"/>',
  basket:'<path d="M6 18h36l-4 22H10z"/><path d="M16 18l6-10M32 18l-6-10"/>',
  pain:'<path d="M28 4 14 26h10l-4 18 16-24H26z"/>',
  apple:'<path d="M24 14c-8-6-18 0-16 12 2 10 10 16 16 12 6 4 14-2 16-12 2-12-8-18-16-12z"/><path d="M24 14c0-5 3-8 7-9"/>'
};
function lineIcon(n,size){size=size||44;return '<svg viewBox="0 0 48 48" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';}
function bodyIcon(k){
  var hl=function(on,shape){return on?shape:'';};
  return '<svg viewBox="0 0 48 56" width="48" height="56" aria-hidden="true"><g fill="var(--line)">'+
    '<circle cx="24" cy="12" r="9"/><rect x="21" y="20" width="6" height="6"/><rect x="12" y="25" width="24" height="28" rx="9"/></g>'+
    hl(k==='cabeca','<circle cx="24" cy="12" r="9" fill="var(--pain)"/>')+
    hl(k==='garganta','<ellipse cx="24" cy="23" rx="7" ry="5" fill="var(--pain)"/>')+
    hl(k==='barriga','<ellipse cx="24" cy="40" rx="9" ry="9" fill="var(--pain)"/>')+'</svg>';
}
function medIcon(n){
  var s='<svg viewBox="0 0 48 48" width="60" height="60" aria-hidden="true">';
  if(n==='pill') s+='<rect x="5" y="12" width="38" height="24" rx="6" fill="var(--m-head)"/><circle cx="14" cy="24" r="4.5" fill="#fff"/><circle cx="24" cy="24" r="4.5" fill="#fff"/><circle cx="34" cy="24" r="4.5" fill="#fff"/>';
  if(n==='drops') s+='<rect x="15" y="22" width="18" height="21" rx="4" fill="var(--m-belly)"/><rect x="20" y="14" width="8" height="9" fill="var(--m-belly)"/><ellipse cx="24" cy="9" rx="5" ry="7" fill="var(--ink)"/><rect x="19" y="29" width="10" height="8" rx="2" fill="#fff"/>';
  if(n==='syrup') s+='<rect x="13" y="18" width="22" height="25" rx="5" fill="var(--m-throat)"/><rect x="19" y="9" width="10" height="10" fill="var(--m-throat)"/><rect x="17" y="4" width="14" height="6" rx="2" fill="var(--ink)"/><rect x="17" y="26" width="14" height="10" rx="2" fill="#fff"/>';
  return s+'</svg>';
}
var $=function(s){return document.querySelector(s)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var voice=true, ther=false, S;
function fresh(){S={phase:'intro',round:0,step:0,errors:0,stepErr:0,stars:[],opts:[],missed:[],sub:null,found:false,mood:'neutral',tapped:[],locked:false,fb:null,curSay:''};}

function stepDef(i,k){
  var p=PARTS[k];
  if(i===0) return {title:'Onde o Teo sente dor?',say:p.say+' Onde o Teo está sentindo dor?',answer:p.label,
    opts:ORDER.map(function(x){return {id:x,label:PARTS[x].label,icon:'body:'+x,ok:x===k};})};
  if(i===1) return {title:'O Teo está com '+p.nome+'. Como ele avisa?',say:'O Teo está com '+p.nome+'. Como ele pode avisar que está com dor?',answer:'Usa a prancha de CAA',
    opts:[{id:'caa',label:'Usa a prancha de CAA',icon:'grid',ok:true},{id:'quiet',label:'Fica quieto, sem avisar',icon:'quiet'},{id:'hide',label:'Se esconde no quarto',icon:'house'}]};
  if(i===2) return {title:'Depois de avisar, o que o Teo faz?',say:'O Teo avisou que está com dor. O que ele faz para receber ajuda?',answer:'Pede ajuda a um adulto',
    opts:[{id:'adult',label:'Pede ajuda a um adulto',icon:'adult',ok:true},{id:'alone',label:'Espera sozinho',icon:'alone'},{id:'ball',label:'Vai brincar de bola',icon:'ball'}]};
  if(i===3) return {title:'Aonde o Teo vai para saber o que ele tem?',say:'O adulto vai ajudar o Teo. Para saber o que ele tem, aonde o Teo vai?',answer:'Vai ao médico',
    opts:[{id:'doc',label:'Vai ao médico',icon:'cross',ok:true},{id:'park',label:'Vai ao parque',icon:'tree'},{id:'shop',label:'Vai ao mercado',icon:'basket'}]};
  return {title:'Qual remédio o Teo toma para '+p.nome+'?',say:'O médico receitou um remédio. Qual remédio o Teo toma para '+p.nome+'?',answer:MEDS[k].label,
    opts:ORDER.map(function(x){return {id:x,label:MEDS[x].label,icon:'med:'+MEDS[x].icon,ok:x===k};})};
}
function curKey(){return ORDER[S.round];}
function speak(t){
  S.curSay=t;
  if(!voice||!window.speechSynthesis) return;
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;window.speechSynthesis.speak(u);}catch(e){}
}
function enterStep(){
  var d=stepDef(S.step,curKey());
  S.opts=shuffle(d.opts);if(S.step===0)S.opts=d.opts;
  S.missed=[];S.stepErr=0;S.sub=null;S.fb=null;S.locked=false;
  render();speak(d.say);
}
function start(){fresh();S.phase='play';S.step=0;enterStep();}
function after(fn,ms){S.locked=true;setTimeout(fn,ms);}

function choose(id){
  if(S.locked||S.phase!=='play'||S.sub==='board')return;
  var d=stepDef(S.step,curKey());
  var o=d.opts.filter(function(x){return x.id===id;})[0];
  if(o&&o.ok) correct(); else wrong(id);
}
function correct(){
  var k=curKey(),p=PARTS[k];
  S.fb={t:'good',x:'Muito bem!'};
  if(S.step===0){S.found=true;S.mood='hurt';}
  if(S.step===4){S.mood='ok';S.fb={t:'good',x:'Muito bem! O Teo tomou o remédio certo.'};}
  render();
  if(S.step===1){after(function(){S.sub='board';S.tapped=[];S.fb=null;S.locked=false;render();speak('Monte a frase na prancha. Toque em dor e em onde dói.');},1000);return;}
  if(S.step===4){after(function(){
      var e=S.errors;S.stars.push(e===0?3:(e<=2?2:1));S.phase='roundEnd';S.locked=false;render();
      speak('O Teo melhorou! Obrigado por cuidar dele.');},1300);return;}
  after(function(){S.step++;enterStep();},1000);
}
function wrong(id){
  S.errors++;S.stepErr++;if(id)S.missed.push(id);
  S.fb={t:'try',x:'Quase! Vamos tentar de novo.'};render();
}
function tile(k){
  if(S.locked||S.sub!=='board')return;
  var key=curKey(),label=k==='dor'?'Dor':(PARTS[k]?PARTS[k].label:(k==='brincar'?'Brincar':'Comer'));
  speak(label);
  var good=(k==='dor'||k===key);
  if(!good){S.errors++;S.fb={t:'try',x:'O Teo precisa avisar que sente dor e onde dói.'};render();return;}
  if(S.tapped.indexOf(k)<0)S.tapped.push(k);
  S.fb=null;
  if(S.tapped.indexOf('dor')>=0&&S.tapped.indexOf(key)>=0){
    S.fb={t:'good',x:'Muito bem! O Teo avisou: '+PARTS[key].nome+'.'};render();
    setTimeout(function(){speak('O Teo avisou: '+PARTS[key].nome+'.');},150);
    after(function(){S.step=2;enterStep();},1900);
  } else render();
}
function nextRound(){
  if(S.round<ORDER.length-1){S.round++;S.step=0;S.errors=0;S.found=false;S.mood='neutral';S.phase='play';enterStep();}
  else{S.phase='end';S.mood='ok';render();speak('Parabéns! Você cuidou do Teo nas três dores.');}
}

function stars(n){return '★★★'.slice(0,n)+'☆☆☆'.slice(0,3-n);}
function renderRounds(){
  $('#rounds').innerHTML=ORDER.map(function(k,i){
    var st=S.stars[i];
    return '<div class="rp'+(S.phase!=='intro'&&S.phase!=='end'&&i===S.round?' now':'')+'"><span>'+PARTS[k].label+'</span><span class="st" aria-label="'+(st?st+' estrelas':'ainda não jogou')+'">'+(st?stars(st):'')+'</span></div>';
  }).join('');
}
function bubbleText(){
  if(S.phase==='intro')return 'Oi! Eu sou o Teo. Você pode me ajudar?';
  if(S.phase==='end'||S.phase==='roundEnd'||S.mood==='ok')return 'Já estou melhor. Obrigado!';
  var p=PARTS[curKey()];
  return S.step===0?p.say:'Estou com '+p.nome+'.';
}
function dollSVG(){
  var k=curKey(),hurt=S.mood==='hurt',ok=S.mood==='ok';
  var mouth=ok?'M100 104 Q120 126 140 104':(hurt?'M104 114 Q120 100 136 114':'M106 108 Q120 116 134 108');
  var brows=hurt?'<path d="M90 70 L108 76M150 70 L132 76" stroke="#3A2A22" stroke-width="4" stroke-linecap="round"/>':'<path d="M92 74 L108 72M148 74 L132 72" stroke="#3A2A22" stroke-width="4" stroke-linecap="round"/>';
  var ring='';
  if(S.found&&!ok&&S.phase==='play'){
    if(k==='cabeca')ring='<circle class="ring" cx="120" cy="76" r="64"/>';
    if(k==='garganta')ring='<ellipse class="ring" cx="120" cy="143" rx="26" ry="18"/>';
    if(k==='barriga')ring='<ellipse class="ring" cx="120" cy="212" rx="44" ry="36"/>';
  }
  var pick=S.phase==='play'&&S.step===0&&S.sub===null&&!S.locked;
  function zone(id,shape){return '<g class="zone-g" data-zone="'+id+'" role="button" tabindex="'+(pick?0:-1)+'" aria-label="'+PARTS[id].label+'">'+shape+'</g>';}
  return '<svg class="doll'+(pick?' pick':'')+'" viewBox="0 0 240 360" role="img" aria-label="Boneco Teo">'+
   '<ellipse cx="120" cy="352" rx="70" ry="6" fill="var(--line)"/>'+
   '<rect x="90" y="262" width="22" height="80" rx="11" fill="#F0C29A"/><rect x="128" y="262" width="22" height="80" rx="11" fill="#F0C29A"/>'+
   '<ellipse cx="98" cy="342" rx="18" ry="9" fill="#34506B"/><ellipse cx="142" cy="342" rx="18" ry="9" fill="#34506B"/>'+
   '<path d="M76 170 L50 244M164 170 L190 244" stroke="#F0C29A" stroke-width="18" stroke-linecap="round"/>'+
   '<rect x="70" y="150" width="100" height="126" rx="36" fill="#F2B134"/>'+
   '<path d="M76 170 L62 208M164 170 L178 208" stroke="#F2B134" stroke-width="24" stroke-linecap="round"/>'+
   '<rect x="74" y="244" width="92" height="36" rx="14" fill="#3E6FB0"/>'+
   '<rect x="108" y="124" width="24" height="34" fill="#F0C29A"/>'+
   '<circle cx="66" cy="84" r="9" fill="#F0C29A"/><circle cx="174" cy="84" r="9" fill="#F0C29A"/>'+
   '<circle cx="120" cy="80" r="54" fill="#F0C29A"/>'+
   '<path d="M66 78 C64 28 176 28 174 78 C160 56 140 50 120 50 C100 50 80 56 66 78Z" fill="#4A3427"/>'+
   '<circle cx="100" cy="90" r="6" fill="#3A2A22"/><circle cx="140" cy="90" r="6" fill="#3A2A22"/>'+brows+
   '<path d="'+mouth+'" fill="none" stroke="#3A2A22" stroke-width="4" stroke-linecap="round"/>'+
   (hurt?'<path d="M92 104 q-4 8 0 12" fill="none" stroke="#6FB8E6" stroke-width="4" stroke-linecap="round"/>':'')+
   ring+
   zone('cabeca','<circle class="zone" cx="120" cy="76" r="54"/>')+
   zone('barriga','<ellipse class="zone" cx="120" cy="212" rx="46" ry="40"/>')+
   zone('garganta','<ellipse class="zone" cx="120" cy="143" rx="28" ry="18"/>')+
   '</svg>';
}
function optHTML(o,d){
  var cls='opt';
  if(S.missed.indexOf(o.id)>=0)cls+=' miss';
  else if(S.stepErr>=2&&o.ok)cls+=' hint';
  var ic=o.icon.indexOf('body:')===0?bodyIcon(o.icon.slice(5)):(o.icon.indexOf('med:')===0?medIcon(o.icon.slice(4)):lineIcon(o.icon));
  return '<button class="'+cls+'" data-opt="'+o.id+'"><span class="ico">'+ic+'</span><span>'+o.label+'</span></button>';
}
function stepChips(){
  return '<div class="steps">'+STEPNAMES.map(function(n,i){
    var c=i<S.step?'done':(i===S.step?'now':'');
    return '<span class="sc '+c+'">'+(i+1)+'. '+n+'</span>';}).join('')+'</div>';
}
function fbHTML(){return '<div class="fb'+(S.fb?' '+S.fb.t:'')+'">'+(S.fb?S.fb.x:'')+'</div>';}
function panelHTML(){
  if(S.phase==='intro'){
    return '<h2>Vamos cuidar do Teo?</h2><p>O Teo vai sentir três dores: de cabeça, de barriga e de garganta. Em cada uma, você responde 5 perguntas: onde dói, como avisar com a prancha de CAA, quem ajuda, aonde ir e qual remédio tomar.</p><button class="big" data-act="start">Começar</button>';
  }
  if(S.phase==='roundEnd'){
    var st=S.stars[S.round],last=S.round===ORDER.length-1;
    return '<h2>O Teo melhorou!</h2><p>'+PARTS[curKey()].nome.charAt(0).toUpperCase()+PARTS[curKey()].nome.slice(1)+': <strong style="color:var(--sun);letter-spacing:3px" aria-label="'+st+' estrelas">'+stars(st)+'</strong></p><button class="big" data-act="next">'+(last?'Ver resultado':'Próxima dor')+'</button>';
  }
  if(S.phase==='end'){
    return '<h2>Parabéns! Você cuidou do Teo.</h2><ul class="sum">'+ORDER.map(function(k,i){return '<li><span>'+PARTS[k].nome.charAt(0).toUpperCase()+PARTS[k].nome.slice(1)+'</span><span class="st">'+stars(S.stars[i])+'</span></li>';}).join('')+'</ul><button class="big" data-act="again">Jogar de novo</button>';
  }
  var d=stepDef(S.step,curKey());
  var h=stepChips()+'<div class="q"><h2>'+d.title+'</h2><button class="listen" data-act="listen">Ouvir</button></div>';
  if(S.sub==='board'){
    var key=curKey();
    var tiles=[{k:'dor',l:'DOR',i:'pain'},{k:'cabeca',l:'CABEÇA',i:null},{k:'barriga',l:'BARRIGA',i:null},{k:'garganta',l:'GARGANTA',i:null},{k:'brincar',l:'BRINCAR',i:'ball'},{k:'comer',l:'COMER',i:'apple'}];
    var order=['dor','cabeca','barriga','garganta','brincar','comer'];
    var strip=S.tapped.length?S.tapped.map(function(t){return '<span class="chip">'+(t==='dor'?'DOR':PARTS[t].cap)+'</span>';}).join(''):'<span class="muted">A frase do Teo aparece aqui.</span>';
    return stepChips()+'<div class="q"><h2>Monte a frase na prancha de CAA</h2><button class="listen" data-act="listen">Ouvir</button></div>'+
      '<p class="muted">Toque em DOR e em onde o Teo sente dor.</p><div class="strip" aria-label="Frase montada">'+strip+'</div>'+
      '<div class="board">'+tiles.map(function(t){
        var ic=t.i?lineIcon(t.i,38):bodyIcon(t.k);
        return '<button class="tile'+(S.tapped.indexOf(t.k)>=0?' on':'')+'" data-tile="'+t.k+'"><span class="ico">'+ic+'</span>'+t.l+'</button>';}).join('')+'</div>'+
      '<div class="row"><button class="ghost" data-act="clear">Apagar frase</button></div>'+fbHTML();
  }
  if(ther){
    h+='<div class="exp">Resposta esperada: '+d.answer+'</div><div class="row"><button class="big" data-act="yes">Acertou</button><button class="ghost" data-act="no">Tentar de novo</button></div>';
  } else {
    if(S.step===0)h+='<p class="muted">Toque no corpo do Teo ou escolha abaixo.</p>';
    h+='<div class="opts">'+S.opts.map(function(o){return optHTML(o,d);}).join('')+'</div>';
    if(S.step===4)h+='<p class="muted">Lembre: o Teo só toma remédio com um adulto e quando o médico manda.</p>';
  }
  return h+fbHTML();
}
function render(){
  renderRounds();
  $('#bubble').textContent=bubbleText();
  $('#doll').innerHTML=dollSVG();
  $('#panel').innerHTML=panelHTML();
}

document.addEventListener('click',function(e){
  var z=e.target.closest('[data-zone]');
  if(z&&S.phase==='play'&&S.step===0&&!ther){choose(z.getAttribute('data-zone'));return;}
  var o=e.target.closest('[data-opt]');if(o){choose(o.getAttribute('data-opt'));return;}
  var t=e.target.closest('[data-tile]');if(t){tile(t.getAttribute('data-tile'));return;}
  var a=e.target.closest('[data-act]');if(!a)return;
  var act=a.getAttribute('data-act');
  if(act==='start'||act==='again')start();
  else if(act==='next')nextRound();
  else if(act==='listen')speak(S.curSay||bubbleText());
  else if(act==='clear'&&!S.locked){S.tapped=[];S.fb=null;render();}
  else if(act==='yes'&&!S.locked)correct();
  else if(act==='no'&&!S.locked)wrong(null);
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('data-zone')){
    e.preventDefault();
    if(S.phase==='play'&&S.step===0&&!ther)choose(e.target.getAttribute('data-zone'));
  }
});
$('#tVoice').addEventListener('click',function(){
  voice=!voice;this.setAttribute('aria-pressed',voice);this.textContent=voice?'Voz ligada':'Voz desligada';
  if(!voice&&window.speechSynthesis){try{window.speechSynthesis.cancel();}catch(e){}}
});
$('#tTher').addEventListener('click',function(){
  ther=!ther;this.setAttribute('aria-pressed',ther);render();
});
fresh();render();
})();
</script>

</body></html>
